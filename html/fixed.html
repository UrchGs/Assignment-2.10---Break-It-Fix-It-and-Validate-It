<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Travel Club | Join Our Monthly Trips</title>
</head>
<body>
  <h1>My Travel Club</h1>
  <h2>Welcome to the club</h2>
  <p>Join us for <strong>amazing trips</strong> this year.</p>
  <div id="intro">
    <p>We visit <em>new places</em> every month.</p>
  </div>
  <div id="latest-trip">
    <h2>Our latest trip</h2>
    <img src="images/beach.jpg" alt="Orange sunset over a calm sea with a dark strip of beach in the foreground" width="600" height="400">
  </div>
  <p>See the <a href="gallery.html">photo gallery</a> or read the <a href="about.html">about page</a>.</p>
  <form action="/join" method="post">
    <label for="name">Your name</label>
    <input type="text" id="name" name="name">
    <label for="email">Email</label>
    <input type="email" id="email" name="email">
    <button type="submit">Join</button>
  </form>
</body>
</html>
